[build-system]
requires = ["setuptools>=77.0.3","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidewalkreator"
version = "0.1.0"
description = "Headless OSM Sidewalkreator - generate sidewalks from OSM data without QGIS GUI"
readme = "README.md"
authors = [ { name = "Kaue Vestena", email = "kauemv2@gmail.com" } ]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["osm", "geopandas", "osmnx", "sidewalks", "gis", "urban_mobility_studies", "vector data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.24",
  "geopandas>=1.0",
  "osmnx>=1.4",
  "shapely>=2.0",
  "scipy>=1.10",
  "pyogrio>=0.7.2",
  "pyproj>=3.6",
  "rtree>=1.0",
  "pandas>=1.5",
  "networkx>=3.0",
  "duckdb>=1.0.0",
  "pmtiles>=3.0.0",
  "mapbox-vector-tile>=2.0.0",
  "mercantile>=1.2.1",
  "tqdm>=4.66",
  "requests>=2.30",
]

[project.urls]
"Homepage" = "https://github.com/kauevestena/headless_sidewalkreator"
"Source" = "https://github.com/kauevestena/headless_sidewalkreator"
"Tracker" = "https://github.com/kauevestena/headless_sidewalkreator/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

performance = [
    "matplotlib>=3.7",
    "pyarrow>=14.0",
]

[project.scripts]
sidewalkreator = "headless_sidewalkreator.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["headless_sidewalkreator", "headless_sidewalkreator.*"]
