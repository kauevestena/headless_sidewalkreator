name: Documentation

on:
  push:
    branches: [feature/headless-prototype]
    paths:
      - docs/**
      - tools/parameter_reference.py
      - headless_sidewalkreator/**
      - pyproject.toml
      - README.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - tools/parameter_reference.py
      - headless_sidewalkreator/**
      - pyproject.toml
      - README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: Check parameter coverage
        run: python tools/parameter_reference.py --check
      - name: Build Sphinx with warnings as errors
        run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
